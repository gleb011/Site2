{% load static %}

{% if user_data %}
<div class="card p-4 mb-4 border rounded-4 bg-white">

    <div class="d-flex align-items-center justify-content-between">

        <div class="d-flex align-items-center gap-3">

            {% if user_data.avatar %}
                <img src="{{ user_data.avatar.url }}" alt="Аватарка"  class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0d6efd20;">
            {% else %}
                <img src="{% static 'img/Avatar.png' %}" alt="Дефолтная аватарка"  class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0d6efd20;">
            {% endif %}

            <div>

                <h6 class="m-0 fw-bold">Andrew, happens something new?</h6>

                <p class="m-0 text-muted small">Tell about it to community</p>

            </div>

        </div>

        <a href="{% url 'post_create' %}" class="btn fw-semibold px-4 rounded-pill" style="background-color: #0D6EFD; color: #ffffff;">
            Create a post
        </a>
    </div>

</div>

{% endif %}
